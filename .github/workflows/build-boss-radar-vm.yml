name: Build BossRadar VM

on:
  push:
    paths:
      - ".github/workflows/build-boss-radar-vm.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install VM compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          rm -rf /tmp/granite
          git clone --filter=blob:none --no-checkout https://github.com/robloxscripter6245366542/roblox-lua-obscator.git /tmp/granite
          cd /tmp/granite
          git sparse-checkout init --cone
          git sparse-checkout set luau-vm
          git checkout c311d6563a9dc98583f7d1076cc3944b3043bd76
          sed -i "0,/'seal', 'sk',/s//'seal', 'sk', 'env',/" /tmp/granite/luau-vm/src/webbundle.lua

      - name: Fetch private source
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rb-vm-build" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          curl -fsS -H "Authorization: Bearer $token"             "https://szfjrpkdbccsveklkwyy.supabase.co/functions/v1/rb-vm-ci-bridge?id=boss_radar"             -o /tmp/boss_radar.lua
          test "$(wc -c </tmp/boss_radar.lua)" -gt 25000
          grep -q 'BossRadar standalone protected core contract: 2' /tmp/boss_radar.lua

      - name: Build six variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rb-vm
          get_token() {
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rb-vm-build" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])'
          }
          cd /tmp/granite/luau-vm
          base=$(( (GITHUB_RUN_ID % 1500000000) + 400000000 ))
          for variant in 1 2 3 4 5 6; do
            seed=$((base + variant*104729 + 99173))
            lua5.4 tools/bundle.lua /tmp/boss_radar.lua "$seed" >/tmp/rb-vm/bundle.lua
            test "$(wc -c </tmp/rb-vm/bundle.lua)" -gt 20000
            grep -q 'Custom bytecode VM' /tmp/rb-vm/bundle.lua
            ! grep -q 'BossRadar standalone protected core contract: 2' /tmp/rb-vm/bundle.lua
            ! grep -Eq 'loadstring[[:space:]]*\(' /tmp/rb-vm/bundle.lua
            lua5.4 -e 'assert(loadfile("/tmp/rb-vm/bundle.lua"))'
            token="$(get_token)"
            echo "::add-mask::$token"
            curl -fsS -X POST -H "Authorization: Bearer $token"               --data-binary @/tmp/rb-vm/bundle.lua               "https://szfjrpkdbccsveklkwyy.supabase.co/functions/v1/rb-vm-ci-bridge?id=boss_radar&variant=$variant"               | grep -q '"ok":true'
          done
          shred -u /tmp/boss_radar.lua /tmp/rb-vm/bundle.lua || true
