name: Build Quest Homes APK

on:
  push:
    branches:
      - quest-homes-app
    paths:
      - "quest-homes/**"
      - ".github/workflows/build-quest-homes.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle -p quest-homes :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Quest-Homes-v0.1-debug
          path: quest-homes/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
