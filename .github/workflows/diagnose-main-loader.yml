name: Diagnose Main Loader

on:
  push:
    paths:
      - ".github/workflows/diagnose-main-loader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch direct protected MAIN core
        shell: bash
        run: |
          set -euo pipefail
          URL='https://szfjrpkdbccsveklkwyy.supabase.co/functions/v1/rb-main-core'
          code="$(curl -sS -D /tmp/core.headers -o /tmp/core.lua -w '%{http_code}' "$URL?cb=$(date +%s)")"
          echo "core_http=$code"
          echo "core_bytes=$(wc -c </tmp/core.lua)"
          grep -E '^(HTTP/|x-rb-|content-type|cache-control)' /tmp/core.headers || true
          if [ "$code" != "200" ]; then
            echo -n "core_error_body="
            head -c 200 /tmp/core.lua || true
            echo
            exit 1
          fi
          grep -q 'Custom bytecode VM' /tmp/core.lua
          echo "core_vm_marker=yes"

      - name: Syntax check protected core
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 -e 'assert(loadfile("/tmp/core.lua"))'
          echo "core_parse=ok"
