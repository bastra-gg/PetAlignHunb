<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RockBug Sessions</title><style>body{font:16px system-ui;background:#101725;color:#e8efff;max-width:900px;margin:auto;padding:18px}h1{font-size:23px}.card{padding:16px;background:#1c293c;border:1px solid #34465c;border-radius:12px;margin:12px 0}input,button{background:#243b59;border:1px solid #526987;color:white;padding:11px;border-radius:8px;font:inherit}input{width:min(85%,440px)}button{margin:4px;cursor:pointer}button:disabled{opacity:.5}small{color:#aebed6}#msg{color:#fbb}</style><h1>RockBug • Управление скриптами</h1><div id="login" class="card"><p>Ключ администратора</p><input id="pass" type="password" placeholder="Введите ключ" autocomplete="off"><button id="enter">Войти</button></div><section id="panel" hidden><div class="card"><b id="count">Сессии</b><p><button id="refresh">Обновить</button><button id="pauseAll">Пауза всем</button><button id="resumeAll">Продолжить всем</button><button id="stopAll">Стоп всем</button><button id="clear">Удалить офлайн</button><button id="logout">Выйти</button></p><small>Обновление каждые 15 секунд</small></div><div id="items"></div></section><p id="msg"></p><script>
(()=>{'use strict';
let key='',timer;const g=id=>document.getElementById(id),say=t=>g('msg').textContent=t;
const url='https://szfjrpkdbccsveklkwyy.supabase.co/functions/v1/rockbug-online';
async function api(action,extra={}){const opt={cache:'no-store',headers:{'x-rockbug-admin':key}};if(action!=='list'){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify({action,...extra});}let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d;}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b;}
async function load(){if(!key)return;try{let d=await api('list');say('');g('count').textContent='Онлайн '+d.online+' / всего '+d.total;g('items').replaceChildren();for(let s of d.sessions){let c=document.createElement('div');c.className='card';let h=document.createElement('h3');h.textContent=(s.display_name||s.player_name||'Игрок')+(s.online?' ●':' ○');let p=document.createElement('p');p.textContent='@'+(s.player_name||'?')+' | '+(s.version||'')+' | '+(s.state||'')+' | '+new Date(s.last_seen).toLocaleString('ru-RU');c.append(h,p);for(let [k,n] of [['pause','Пауза'],['resume','Продолжить'],['stop','Остановить']]){let b=button(n,()=>cmd(k,s.session_id));b.disabled=!s.online;c.append(b);}c.append(button('Удалить',async()=>{if(!confirm('Удалить запись?'))return;try{await api('delete',{session_id:s.session_id});await load()}catch(e){say(e.message)}}));g('items').append(c);}}catch(e){say('Ошибка: '+e.message)}}
async function cmd(command,session_id){if((session_id==='all'||command==='stop')&&!confirm('Отправить команду '+command+'?'))return;try{await api('command',{command,session_id});await load()}catch(e){say(e.message)}}
g('enter').onclick=async()=>{key=g('pass').value.trim();try{await api('list');g('pass').value='';g('login').hidden=true;g('panel').hidden=false;await load();timer=setInterval(load,15000)}catch(e){key='';say('Неверный ключ или ошибка: '+e.message)}};
g('refresh').onclick=load;for(const [b,k] of [['pauseAll','pause'],['resumeAll','resume'],['stopAll','stop']])g(b).onclick=()=>cmd(k,'all');g('clear').onclick=async()=>{if(!confirm('Удалить офлайн?'))return;try{await api('clear_offline');await load()}catch(e){say(e.message)}};g('logout').onclick=()=>{clearInterval(timer);key='';g('panel').hidden=true;g('login').hidden=false;};
})();
</script></html>
